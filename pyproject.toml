[project]
name = "aiscan"
version = "0.1.0"
description = "Cong cu AI danh gia an toan thong tin source code, tich hop Codev (GitLab), dung LLM MiniMax-M3 qua cong noi bo Viettel."
requires-python = ">=3.9"
dependencies = []

[project.scripts]
aiscan = "aiscan.__main__:main"
aiscan-scan-meta = "aiscan.cli.write_scan_meta:main"
aiscan-save-result = "aiscan.cli.save_result:main"
aiscan-render-report = "aiscan.cli.render_report:main"
aiscan-patch-artifacts = "aiscan.cli.patch_artifacts:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["phat_trien_loi"]

[tool.setuptools.package-data]
"aiscan.lib" = ["cwe-categories.json"]
